<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浴山問卷後台 — 數據儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:   #50A8CC;
  --navy:   #0A2540;
  --blue:   #1E5BAE;
  --black:  #0e1117;
  --surface:#161b24;
  --card:   #1e2535;
  --border: rgba(255,255,255,.07);
  --txt:    #e8eaf0;
  --txt2:   #8b93a7;
  --txt3:   #4f5668;
  --f-zh:   'Noto Sans TC', sans-serif;
  --f-en:   'DM Sans', sans-serif;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { background:var(--black); color:var(--txt); font-family:var(--f-zh); }
body { min-height:100vh; padding:0 0 60px; }

/* ── 頂部 header ── */
.header {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:18px 32px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.header-logo { display:flex; align-items:center; gap:12px; }
.header-logo img { height:28px; filter:brightness(0) invert(1); opacity:.85; }
.header-title { font-size:13px; color:var(--txt2); letter-spacing:.5px; }
.header-right { display:flex; align-items:center; gap:16px; }
.refresh-btn {
  font-size:12px; padding:7px 16px; border-radius:20px;
  background:rgba(80,168,204,.12); color:var(--gold);
  border:1px solid rgba(80,168,204,.25); cursor:pointer;
  font-family:var(--f-en); transition:background .2s;
}
.refresh-btn:hover { background:rgba(80,168,204,.2); }
.last-updated { font-size:11px; color:var(--txt3); }

/* ── 主容器 ── */
.container { max-width:1100px; margin:0 auto; padding:32px 24px; }

/* ── 摘要卡片 ── */
.summary-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  margin-bottom:32px;
}
@media (max-width:700px) { .summary-grid { grid-template-columns:repeat(2,1fr); } }
.kpi-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px 20px;
}
.kpi-label { font-size:11px; color:var(--txt3); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.kpi-value { font-size:clamp(28px,4vw,38px); font-weight:700; color:var(--txt); font-family:var(--f-en); line-height:1; }
.kpi-unit { font-size:14px; color:var(--txt2); margin-left:4px; font-weight:400; }
.kpi-card.accent .kpi-value { color:var(--gold); }

/* ── 區塊標題 ── */
.section { margin-bottom:32px; }
.section-title {
  font-size:13px; font-weight:500; color:var(--txt2);
  letter-spacing:1px; text-transform:uppercase;
  margin-bottom:16px; padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

/* ── 圖表卡片 ── */
.chart-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px;
}
.chart-card + .chart-card { margin-top:16px; }
.chart-title { font-size:14px; font-weight:500; color:var(--txt); margin-bottom:20px; }

/* ── 折線圖 ── */
.line-chart-wrap { width:100%; overflow-x:auto; }
canvas { display:block; }

/* ── 橫條圖（問題統計）── */
.bar-list { display:flex; flex-direction:column; gap:12px; }
.bar-item { display:flex; align-items:center; gap:12px; }
.bar-label { font-size:13px; color:var(--txt2); min-width:110px; flex-shrink:0; text-align:right; }
.bar-track { flex:1; height:8px; background:rgba(255,255,255,.06); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; background:var(--gold); transition:width .6s cubic-bezier(.34,1.3,.64,1); }
.bar-count { font-size:13px; color:var(--txt); min-width:48px; font-family:var(--f-en); font-weight:500; }
.bar-pct { font-size:11px; color:var(--txt3); min-width:36px; }

/* ── 雙欄佈局 ── */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:700px) { .two-col { grid-template-columns:1fr; } }

/* ── 分佈條（性別/尺寸）── */
.dist-wrap { display:flex; flex-direction:column; gap:10px; }
.dist-item { display:flex; align-items:center; gap:10px; }
.dist-label { font-size:13px; color:var(--txt2); min-width:90px; flex-shrink:0; }
.dist-bar { flex:1; height:24px; background:rgba(255,255,255,.06); border-radius:6px; overflow:hidden; position:relative; }
.dist-fill { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--gold) 0%, var(--blue) 100%); transition:width .6s cubic-bezier(.34,1.3,.64,1); }
.dist-n { font-size:12px; color:var(--txt3); min-width:32px; text-align:right; font-family:var(--f-en); }

/* ── 分數分佈 ── */
.intent-grid { display:flex; align-items:flex-end; gap:6px; height:90px; }
.intent-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.intent-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
.intent-bar { width:100%; border-radius:3px 3px 0 0; background:var(--gold); transition:height .5s cubic-bezier(.34,1.3,.64,1); min-height:2px; }
.intent-n { font-size:10px; color:var(--txt3); font-family:var(--f-en); }
.intent-lbl { font-size:11px; color:var(--txt3); }
.intent-avg { font-size:28px; font-weight:700; color:var(--gold); font-family:var(--f-en); margin-top:12px; }
.intent-avg-label { font-size:12px; color:var(--txt3); margin-top:2px; }

/* ── loading/error ── */
.loading { text-align:center; padding:80px 20px; color:var(--txt3); font-size:14px; }
.error-msg { background:rgba(220,60,60,.1); border:1px solid rgba(220,60,60,.2); border-radius:8px; padding:16px; color:#e87070; font-size:13px; margin-bottom:24px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <img src="https://pic.mieloo-corp.com/uploads/medium/ec/8c/0498cef723b64fe276e18da9eb1a.png" alt="浴山">
    <span class="header-title">問卷數據儀表板</span>
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">載入中…</span>
    <button class="refresh-btn" onclick="loadData()">↻ 重新整理</button>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">載入資料中…</div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby8loHM_Th6iMYyERRPy_O1KQrWD21ZshQiMATU7C9gZSa1621Q2w-S38N4NIFjGVrs/exec';

async function loadData() {
  const app = document.getElementById('app');
  document.getElementById('lastUpdated').textContent = '更新中…';
  try {
    const res  = await fetch(GAS_URL + '?action=stats');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    document.getElementById('lastUpdated').textContent =
      '最後更新：' + new Date().toLocaleTimeString('zh-TW');
  } catch (e) {
    app.innerHTML = `<div class="error-msg">讀取資料失敗：${e.message}<br>請確認 GAS 已部署為 v3 且 action=stats 端點已啟用。</div>`;
    document.getElementById('lastUpdated').textContent = '讀取失敗';
  }
}

function pct(n, total) {
  if (!total) return '0%';
  return (n / total * 100).toFixed(0) + '%';
}

function render(d) {
  const app = document.getElementById('app');
  const s   = d.summary;
  const n   = +s.totalResponses;

  app.innerHTML = `
    <!-- 摘要 KPI -->
    <div class="summary-grid">
      <div class="kpi-card">
        <div class="kpi-label">總瀏覽數</div>
        <div class="kpi-value">${(+s.totalVisits).toLocaleString()}<span class="kpi-unit">次</span></div>
      </div>
      <div class="kpi-card accent">
        <div class="kpi-label">總回覆數</div>
        <div class="kpi-value">${(+s.totalResponses).toLocaleString()}<span class="kpi-unit">份</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">回覆率</div>
        <div class="kpi-value">${s.responseRate}<span class="kpi-unit">%</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">最新回覆時間</div>
        <div class="kpi-value" style="font-size:18px; padding-top:6px">${s.latestTime || '—'}</div>
      </div>
    </div>

    <!-- 每日折線圖 -->
    <div class="section">
      <div class="section-title">回覆趨勢</div>
      <div class="chart-card">
        <div class="chart-title">每日回覆人數</div>
        <div class="line-chart-wrap">
          <canvas id="lineChart" height="180"></canvas>
        </div>
      </div>
    </div>

    <!-- Q1 + Q3 -->
    <div class="section">
      <div class="section-title">問卷結果</div>
      <div class="chart-card">
        <div class="chart-title">Q1 — 你家水槽是否有這些困擾？（可複選）</div>
        <div class="bar-list" id="q1bars"></div>
      </div>

      <div class="chart-card" style="margin-top:16px">
        <div class="chart-title">Q3 — 哪個特色最打動你？（可複選）</div>
        <div class="bar-list" id="q3bars"></div>
      </div>
    </div>

    <!-- Q4 + Q2 + Q5 + Q6 -->
    <div class="section">
      <div class="two-col">
        <div class="chart-card">
          <div class="chart-title">Q4 — 購買意願分數</div>
          <div class="intent-grid" id="intentGrid"></div>
          <div class="intent-avg" id="intentAvg">—</div>
          <div class="intent-avg-label">平均分數（滿分 7）</div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Q6 — 性別分布</div>
          <div class="dist-wrap" id="genderDist"></div>
        </div>
      </div>
      <div class="two-col" style="margin-top:16px">
        <div class="chart-card">
          <div class="chart-title">Q2 — 水槽尺寸</div>
          <div class="dist-wrap" id="sinkDist"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Q5 — 有興趣的加購品</div>
          <div class="bar-list" id="q5bars"></div>
        </div>
      </div>
    </div>
  `;

  /* ── 折線圖 ── */
  drawLineChart(d.daily);

  /* ── Q1 痛點 ── */
  renderBars('q1bars', d.q1_pains.labels, d.q1_pains.counts, n);

  /* ── Q3 功能 ── */
  renderBars('q3bars', d.q3_feats.labels, d.q3_feats.counts, n);

  /* ── Q4 意願分數 ── */
  const b = d.q4_intent.buckets;
  const maxB = Math.max(...Object.values(b), 1);
  const grid = document.getElementById('intentGrid');
  grid.innerHTML = [1,2,3,4,5,6,7].map(k => `
    <div class="intent-col">
      <div class="intent-bar-wrap">
        <div class="intent-bar" style="height:${Math.round((b[k]||0)/maxB*70)}px"></div>
      </div>
      <div class="intent-n">${b[k]||0}</div>
      <div class="intent-lbl">${k}</div>
    </div>`).join('');
  document.getElementById('intentAvg').textContent = d.q4_intent.avg || '—';

  /* ── Q5 加購 ── */
  renderBars('q5bars', d.q5_addons.labels, d.q5_addons.counts, n);

  /* ── Q2 水槽 ── */
  const sink = d.q2_sink;
  const sinkTotal = Object.values(sink).reduce((a,b)=>a+b,0)||1;
  document.getElementById('sinkDist').innerHTML =
    Object.entries(sink).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
      <div class="dist-item">
        <div class="dist-label">${k}</div>
        <div class="dist-bar"><div class="dist-fill" style="width:${(v/sinkTotal*100).toFixed(0)}%"></div></div>
        <div class="dist-n">${v}</div>
      </div>`).join('');

  /* ── Q6 性別 ── */
  const gLabels = {female:'女性',male:'男性',other:'其他/不透露'};
  const gender = d.q6_gender;
  const gTotal = Object.values(gender).reduce((a,b)=>a+b,0)||1;
  document.getElementById('genderDist').innerHTML =
    Object.entries(gender).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
      <div class="dist-item">
        <div class="dist-label">${gLabels[k]||k}</div>
        <div class="dist-bar"><div class="dist-fill" style="width:${(v/gTotal*100).toFixed(0)}%"></div></div>
        <div class="dist-n">${v}</div>
      </div>`).join('');
}

function renderBars(elId, labels, counts, total) {
  const max = Math.max(...counts, 1);
  document.getElementById(elId).innerHTML = labels.map((lbl,i) => `
    <div class="bar-item">
      <div class="bar-label">${lbl}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(counts[i]/max*100).toFixed(0)}%"></div></div>
      <div class="bar-count">${counts[i]}</div>
      <div class="bar-pct">${pct(counts[i], total)}</div>
    </div>`).join('');
}

function drawLineChart(daily) {
  const canvas = document.getElementById('lineChart');
  if (!canvas || !daily || daily.length === 0) return;
  const W = canvas.parentElement.offsetWidth;
  canvas.width  = W;
  canvas.height = 180;
  const ctx = canvas.getContext('2d');
  const PAD = { top:16, right:20, bottom:32, left:36 };
  const w = W - PAD.left - PAD.right;
  const h = 180 - PAD.top - PAD.bottom;
  const maxV = Math.max(...daily.map(d=>d.count), 1);

  ctx.clearRect(0,0,W,180);

  /* 格線 */
  const steps = 4;
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth   = 1;
  for (let i=0;i<=steps;i++) {
    const y = PAD.top + h - (i/steps)*h;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left+w, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.font = '10px DM Sans, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV*i/steps), PAD.left-6, y+4);
  }

  /* 點座標 */
  const pts = daily.map((d,i) => ({
    x: PAD.left + (i/(daily.length-1||1))*w,
    y: PAD.top  + h - (d.count/maxV)*h,
    label: d.date, count: d.count
  }));

  /* 填充漸層 */
  const grad = ctx.createLinearGradient(0,PAD.top,0,PAD.top+h);
  grad.addColorStop(0,'rgba(80,168,204,.3)');
  grad.addColorStop(1,'rgba(80,168,204,.0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, PAD.top+h);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, PAD.top+h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  /* 折線 */
  ctx.beginPath();
  ctx.strokeStyle = '#50A8CC';
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.stroke();

  /* 資料點 */
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2);
    ctx.fillStyle = '#50A8CC';
    ctx.fill();
    ctx.strokeStyle = '#0e1117';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  /* X 軸日期標籤（最多顯示 10 個）── */
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.font = '10px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  const step = Math.ceil(daily.length / 10);
  daily.forEach((d,i) => {
    if (i % step !== 0 && i !== daily.length-1) return;
    const x = PAD.left + (i/(daily.length-1||1))*w;
    ctx.fillText(d.date.slice(5), x, PAD.top+h+18);
  });
}

loadData();
window.addEventListener('resize', () => {
  /* 視窗改變時重繪折線圖 */
  const canvas = document.getElementById('lineChart');
  if (canvas) canvas.dispatchEvent(new Event('redraw'));
});
</script>
</body>
</html>
