<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浴山問卷後台 — 數據儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════ 主題變數 ═══════════ */
:root, [data-theme="dark"] {
  --gold:  #50A8CC;
  --navy:  #0A2540;
  --blue:  #1E5BAE;
  --ice:   #c8e8ff;
  --txt:   #eef4fb;
  --txt2:  #8fa3bd;
  --txt3:  #56688a;
  --bg:        linear-gradient(155deg, #0d1f3c 0%, #0a2540 50%, #061a2f 100%);
  --glow1:     rgba(80,168,204,.14);
  --glow2:     rgba(30,91,174,.12);
  --card:      rgba(255,255,255,.045);
  --card-border: rgba(168,212,255,.1);
  --card-hover:  rgba(126,200,255,.3);
  --track:     rgba(255,255,255,.05);
  --header-bg: rgba(10,23,40,.6);
  --header-border: rgba(168,212,255,.08);
  --grid-line: rgba(168,212,255,.06);
  --axis-txt:  rgba(168,212,255,.3);
  --tooltip-bg:'rgba(10,25,45,.92)';
  --hero-grad: linear-gradient(128deg, #c8e8ff 0%, #7ec8ff 28%, #6ba3e0 55%, #a8d4ff 100%);
  --panel-bg:  #0e2038;
  --f-zh: 'Noto Sans TC', sans-serif;
  --f-en: 'DM Sans', sans-serif;
  --r: 20px;
}
[data-theme="light"] {
  --txt:   #0A2540;
  --txt2:  #4a5f7d;
  --txt3:  #8ba0bd;
  --ice:   #1E5BAE;
  --bg:        linear-gradient(155deg, #eef6ff 0%, #f0f7ff 55%, #e2efff 100%);
  --glow1:     rgba(80,168,204,.1);
  --glow2:     rgba(126,200,255,.14);
  --card:      rgba(255,255,255,.72);
  --card-border: rgba(30,91,174,.1);
  --card-hover:  rgba(30,91,174,.3);
  --track:     rgba(10,37,64,.06);
  --header-bg: rgba(240,247,255,.7);
  --header-border: rgba(30,91,174,.1);
  --grid-line: rgba(30,91,174,.08);
  --axis-txt:  rgba(30,91,174,.4);
  --hero-grad: linear-gradient(128deg, #1E5BAE 0%, #50A8CC 45%, #0d1f3c 100%);
  --panel-bg:  #f4faff;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  min-height:100vh; font-family:var(--f-zh); color:var(--txt);
  background:var(--bg); background-attachment:fixed;
  padding-bottom:100px; overflow-x:hidden;
  transition:color .3s ease;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 800px 500px at 75% -5%, var(--glow1), transparent 60%),
    radial-gradient(ellipse 600px 420px at 12% 40%, var(--glow2), transparent 65%);
}

/* ═══════════ Header ═══════════ */
.header {
  position:sticky; top:0; z-index:100;
  backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
  background:var(--header-bg);
  border-bottom:1px solid var(--header-border);
  padding:14px max(24px, 4vw);
  display:flex; align-items:center; justify-content:space-between;
}
.h-logo { display:flex; align-items:center; gap:14px; }
.h-logo img { height:26px; opacity:.9; }
[data-theme="dark"] .h-logo img { filter:brightness(0) invert(1); }
[data-theme="light"] .h-logo img { filter:brightness(0); }
.h-divider { width:1px; height:18px; background:var(--card-border); }
.h-title { font-size:13px; font-weight:400; color:var(--txt2); letter-spacing:1px; }
.h-right { display:flex; align-items:center; gap:12px; }
.h-updated { font-size:11px; color:var(--txt3); font-family:var(--f-en); }
.hbtn {
  font-size:12px; font-weight:500; padding:8px 18px; border-radius:99px;
  background:rgba(80,168,204,.14); color:var(--ice);
  border:1px solid rgba(80,168,204,.3); cursor:pointer;
  font-family:var(--f-zh); transition:all .25s ease; letter-spacing:.5px;
  display:flex; align-items:center; gap:6px;
}
.hbtn:hover { background:rgba(80,168,204,.28); transform:translateY(-1px); }

/* ═══════════ 設定面板 ═══════════ */
.settings-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.settings-overlay.open { opacity:1; pointer-events:all; }
.settings-panel {
  position:fixed; top:0; right:0; bottom:0; width:min(340px, 88vw); z-index:201;
  background:var(--panel-bg);
  border-left:1px solid var(--card-border);
  transform:translateX(100%); transition:transform .35s cubic-bezier(.22,1,.36,1);
  overflow-y:auto; padding:24px;
}
.settings-panel.open { transform:translateX(0); }
.sp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
.sp-title { font-size:16px; font-weight:700; color:var(--txt); }
.sp-close { background:none; border:none; font-size:20px; color:var(--txt2); cursor:pointer; padding:4px 8px; }
.sp-group { margin-bottom:26px; }
.sp-group-title { font-size:11px; letter-spacing:2px; color:var(--txt3); text-transform:uppercase; font-family:var(--f-en); margin-bottom:12px; }
.sp-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 0; border-bottom:1px solid var(--card-border);
}
.sp-label { font-size:14px; color:var(--txt); }
/* toggle switch */
.tgl { position:relative; width:44px; height:24px; flex-shrink:0; }
.tgl input { opacity:0; width:0; height:0; }
.tgl-slider {
  position:absolute; inset:0; border-radius:99px; cursor:pointer;
  background:var(--track); border:1px solid var(--card-border);
  transition:background .25s ease;
}
.tgl-slider::before {
  content:''; position:absolute; width:18px; height:18px; border-radius:50%;
  left:2px; top:2px; background:var(--txt2); transition:transform .25s cubic-bezier(.22,1,.36,1), background .25s;
}
.tgl input:checked + .tgl-slider { background:var(--gold); border-color:var(--gold); }
.tgl input:checked + .tgl-slider::before { transform:translateX(20px); background:#fff; }
/* segmented control（主題/圖型切換） */
.seg { display:flex; background:var(--track); border-radius:10px; padding:3px; gap:2px; }
.seg button {
  flex:1; font-size:12px; padding:7px 12px; border:none; border-radius:8px;
  background:transparent; color:var(--txt2); cursor:pointer;
  font-family:var(--f-zh); transition:all .2s ease; white-space:nowrap;
}
.seg button.on { background:var(--gold); color:#fff; font-weight:500; }

/* ═══════════ 主容器 ═══════════ */
.container { max-width:1120px; margin:0 auto; padding:0 max(20px,3vw); position:relative; z-index:1; }

.hero { text-align:center; padding:76px 0 60px; }
.hero-eyebrow { font-size:13px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; font-family:var(--f-en); font-weight:500; margin-bottom:18px; }
.hero-number {
  font-size:clamp(72px,13vw,128px); font-weight:700; font-family:var(--f-en);
  line-height:1; letter-spacing:-3px;
  background:var(--hero-grad);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 40px rgba(126,200,255,.2));
}
.hero-label { font-size:16px; color:var(--txt2); margin-top:14px; font-weight:300; letter-spacing:2px; }

.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:760px; margin:44px auto 0; }
@media (max-width:640px){ .kpi-row { grid-template-columns:1fr; } }
.kpi {
  background:var(--card); border:1px solid var(--card-border);
  border-radius:var(--r); padding:26px 20px; text-align:center;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:transform .3s ease, border-color .3s ease;
}
.kpi:hover { transform:translateY(-3px); border-color:var(--card-hover); }
.kpi-v { font-size:clamp(26px,4vw,34px); font-weight:700; font-family:var(--f-en); color:var(--ice); line-height:1.1; }
.kpi-v .u { font-size:14px; font-weight:400; color:var(--txt2); margin-left:3px; }
.kpi-l { font-size:12px; color:var(--txt3); margin-top:8px; letter-spacing:1.5px; }

.pearl-divider {
  position:relative; height:1px; margin:70px auto 60px; max-width:520px;
  background:linear-gradient(90deg, transparent, rgba(126,200,255,.4) 50%, transparent);
}
.pearl-divider::after {
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:6px; height:6px; border-radius:50%;
  background:var(--ice); box-shadow:0 0 12px 3px rgba(126,200,255,.5);
}

.section { margin-bottom:56px; }
.sec-head { text-align:center; margin-bottom:34px; }
.sec-kicker { font-size:11px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; font-family:var(--f-en); font-weight:500; margin-bottom:10px; }
.sec-title {
  font-size:clamp(24px,4.6vw,34px); font-weight:700; letter-spacing:.5px;
  background:var(--hero-grad);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.card {
  background:var(--card); border:1px solid var(--card-border);
  border-radius:var(--r); padding:32px 30px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.card + .card { margin-top:16px; }
.card-title { font-size:15px; font-weight:500; color:var(--txt); margin-bottom:6px; }
.card-sub { font-size:12px; color:var(--txt3); margin-bottom:26px; }

canvas { display:block; width:100%; }

.bars { display:flex; flex-direction:column; gap:18px; }
.bar-row { display:grid; grid-template-columns:110px 1fr 84px; align-items:center; gap:16px; }
@media (max-width:560px){ .bar-row { grid-template-columns:88px 1fr 76px; gap:10px; } }
.bar-name { font-size:13px; color:var(--txt2); text-align:right; }
.bar-track { height:10px; background:var(--track); border-radius:99px; overflow:hidden; }
.bar-fill {
  height:100%; border-radius:99px; width:0;
  transition:width 1s cubic-bezier(.22,1,.36,1), background .3s ease, box-shadow .3s ease;
}
.bar-meta { font-family:var(--f-en); font-size:13px; color:var(--ice); white-space:nowrap; }
.bar-meta .pc { color:var(--txt3); font-size:11px; margin-left:6px; }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:720px){ .two-col { grid-template-columns:1fr; } }

.intent-wrap { display:flex; align-items:flex-end; gap:8px; height:120px; margin-bottom:8px; }
.ic { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; }
.ic-bar-zone { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.ic-bar {
  width:70%; max-width:34px; border-radius:6px 6px 2px 2px; min-height:3px; height:0;
  background:linear-gradient(180deg, #7ec8ff, #1E5BAE);
  box-shadow:0 0 12px rgba(80,168,204,.3);
  transition:height .9s cubic-bezier(.22,1,.36,1);
}
.ic-n { font-size:11px; color:var(--txt2); font-family:var(--f-en); }
.ic-s { font-size:12px; color:var(--txt3); font-family:var(--f-en); }
.intent-summary { text-align:center; margin-top:22px; }
.intent-avg {
  font-size:clamp(44px,7vw,60px); font-weight:700; font-family:var(--f-en); line-height:1;
  background:var(--hero-grad);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.intent-avg-l { font-size:12px; color:var(--txt3); margin-top:8px; letter-spacing:1.5px; }

.dists { display:flex; flex-direction:column; gap:16px; }
.dist-row { display:grid; grid-template-columns:96px 1fr 40px; align-items:center; gap:14px; }
.dist-name { font-size:13px; color:var(--txt2); }
.dist-track { height:26px; background:var(--track); border-radius:9px; overflow:hidden; }
.dist-fill {
  height:100%; border-radius:9px; width:0;
  transition:width 1s cubic-bezier(.22,1,.36,1), background .3s ease;
}
.dist-n { font-family:var(--f-en); font-size:13px; color:var(--ice); text-align:right; }

/* ── 圓餅圖 ── */
.pie-flex { display:flex; align-items:center; gap:28px; flex-wrap:wrap; justify-content:center; }
.pie-canvas-wrap { position:relative; width:190px; height:190px; flex-shrink:0; }
.pie-center {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none;
}
.pie-center-n { font-size:26px; font-weight:700; font-family:var(--f-en); color:var(--txt); line-height:1; }
.pie-center-l { font-size:10px; color:var(--txt3); margin-top:4px; letter-spacing:1px; }
.pie-legend { display:flex; flex-direction:column; gap:10px; min-width:160px; }
.pl-row { display:flex; align-items:center; gap:10px; font-size:13px; }
.pl-chip { width:12px; height:12px; border-radius:4px; flex-shrink:0; }
.pl-name { color:var(--txt2); flex:1; }
.pl-val { font-family:var(--f-en); color:var(--ice); font-weight:500; }
.pl-pct { font-family:var(--f-en); color:var(--txt3); font-size:11px; min-width:38px; text-align:right; }

.reveal { opacity:0; transform:translateY(28px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1); }
.reveal.in { opacity:1; transform:translateY(0); }

.loading { text-align:center; padding:120px 20px; color:var(--txt3); font-size:14px; letter-spacing:2px; }
.loading::after { content:'…'; animation:dots 1.4s steps(4) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
.error-msg {
  background:rgba(220,80,80,.08); border:1px solid rgba(220,80,80,.2);
  border-radius:14px; padding:20px 24px; color:#e89090; font-size:13px;
  max-width:560px; margin:60px auto; text-align:center; line-height:1.8;
}
/* ── 留言卡片 ── */
.cmt-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.cmt-count { font-size:12px; color:var(--txt3); }
.cmt-show-hidden {
  font-size:11px; color:var(--txt2); cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:6px;
}
.cmt-list { display:flex; flex-direction:column; gap:12px; }
.cmt-item {
  border:1px solid var(--card-border); border-radius:14px; padding:16px 18px;
  background:rgba(255,255,255,.02); transition:opacity .2s ease, border-color .2s ease;
}
.cmt-item.mark-good { border-color:rgba(80,255,160,.4); background:rgba(80,255,160,.05); }
.cmt-item.mark-bad  { border-color:rgba(255,90,170,.3); background:rgba(255,90,170,.04); opacity:.6; }
.cmt-item.mark-hidden { display:none; }
.cmt-item.mark-hidden.force-show { display:block; opacity:.45; }
.cmt-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.cmt-who { font-size:12px; color:var(--txt2); font-weight:500; }
.cmt-time { font-size:11px; color:var(--txt3); font-family:var(--f-en); }
.cmt-text { font-size:14px; color:var(--txt); line-height:1.7; margin-bottom:12px; white-space:pre-wrap; }
.cmt-actions { display:flex; gap:8px; }
.cmt-btn {
  font-size:11px; padding:5px 12px; border-radius:99px; border:1px solid var(--card-border);
  background:transparent; color:var(--txt3); cursor:pointer; transition:all .2s ease;
  font-family:var(--f-zh); display:flex; align-items:center; gap:4px;
}
.cmt-btn:hover { border-color:var(--card-hover); }
.cmt-btn.active-good { background:rgba(80,255,160,.15); border-color:rgba(80,255,160,.4); color:#5cffa0; }
.cmt-btn.active-bad  { background:rgba(255,90,170,.15); border-color:rgba(255,90,170,.4); color:#ff5aaa; }
.cmt-btn.active-hide { background:rgba(255,255,255,.08); color:var(--txt2); }
.cmt-empty { text-align:center; color:var(--txt3); font-size:13px; padding:30px 0; }

/* ── 分頁列 ── */
.tabbar {
  display:flex; gap:6px; justify-content:center; margin:28px 0 0;
  position:relative; z-index:2;
}
.tab-btn {
  font-size:13px; font-weight:500; padding:9px 26px; border-radius:99px;
  background:transparent; color:var(--txt2); cursor:pointer;
  border:1px solid transparent; font-family:var(--f-zh); letter-spacing:1px;
  transition:all .25s ease;
}
.tab-btn:hover { color:var(--txt); }
.tab-btn.on {
  background:rgba(80,168,204,.14); color:var(--ice);
  border-color:rgba(126,200,255,.25);
}

/* ── 交叉分析 ── */
.x-bars { display:flex; flex-direction:column; gap:18px; }
.x-row { display:grid; grid-template-columns:130px 1fr 110px; align-items:center; gap:16px; }
@media (max-width:560px){ .x-row { grid-template-columns:96px 1fr 96px; gap:10px; } }
.x-name { font-size:13px; color:var(--txt2); text-align:right; }
.x-track { height:12px; background:var(--track); border-radius:99px; overflow:hidden; }
.x-fill { height:100%; border-radius:99px; width:0; transition:width 1s cubic-bezier(.22,1,.36,1), background .3s ease; }
.x-meta { font-family:var(--f-en); font-size:14px; font-weight:700; color:var(--ice); white-space:nowrap; }
.x-meta .xn { color:var(--txt3); font-size:11px; font-weight:400; margin-left:6px; }
.x-ref { font-size:11px; color:var(--txt3); margin-top:14px; text-align:right; }

/* 熱力圖矩陣 */
.heat-wrap { overflow-x:auto; }
.heat-grid { display:grid; gap:4px; min-width:520px; }
.heat-cell {
  border-radius:8px; padding:12px 6px; text-align:center;
  font-family:var(--f-en); font-size:13px; font-weight:700; color:#fff;
  transition:transform .15s ease;
}
.heat-cell:hover { transform:scale(1.05); }
.heat-head {
  background:transparent !important; color:var(--txt2) !important;
  font-family:var(--f-zh); font-size:11px; font-weight:400; padding:8px 4px;
  display:flex; align-items:center; justify-content:center; text-align:center;
}
.heat-rowlabel { justify-content:flex-end; text-align:right; padding-right:10px; }
.heat-sub { display:block; font-size:9px; font-weight:400; opacity:.75; margin-top:2px; }
.heat-note { font-size:11px; color:var(--txt3); margin-top:14px; line-height:1.7; }

/* ── LINE 成效表格 ── */
.ltable-wrap { max-height:440px; overflow:auto; border-radius:12px; }
.ltable { width:100%; border-collapse:collapse; font-size:13px; }
.ltable th {
  text-align:right; color:var(--txt3); font-weight:400; font-size:11px; letter-spacing:1px;
  padding:8px 12px; border-bottom:1px solid var(--card-border);
  position:sticky; top:0; background:var(--panel-bg); z-index:1;
}
.ltable td { text-align:right; padding:9px 12px; border-bottom:1px solid var(--card-border); color:var(--txt); font-family:var(--f-en); }
.ltable td.zh { font-family:var(--f-zh); color:var(--txt2); font-size:12px; text-align:left; }

.foot { text-align:center; margin-top:80px; font-size:11px; color:var(--txt3); letter-spacing:2px; font-family:var(--f-en); }

@media (prefers-reduced-motion: reduce) {
  .reveal { transition:none; opacity:1; transform:none; }
  .bar-fill, .ic-bar, .dist-fill { transition:none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="h-logo">
    <img src="https://pic.mieloo-corp.com/uploads/medium/ec/8c/0498cef723b64fe276e18da9eb1a.png" alt="浴山">
    <div class="h-divider"></div>
    <span class="h-title">問卷數據儀表板</span>
  </div>
  <div class="h-right">
    <span class="h-updated" id="lastUpdated"></span>
    <button class="hbtn" onclick="loadData()">重新整理</button>
    <button class="hbtn" onclick="openSettings()">⚙ 設定</button>
  </div>
</div>

<!-- 設定面板 -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="sp-head">
    <div class="sp-title">顯示設定</div>
    <button class="sp-close" onclick="closeSettings()">✕</button>
  </div>

  <div class="sp-group">
    <div class="sp-group-title">介面主題</div>
    <div class="seg" id="themeSeg">
      <button data-v="dark" onclick="setTheme('dark')">深色</button>
      <button data-v="light" onclick="setTheme('light')">淺色</button>
    </div>
  </div>

  <div class="sp-group">
    <div class="sp-group-title">圖表顯示</div>
    <div class="sp-row">
      <span class="sp-label">回覆趨勢折線圖</span>
      <label class="tgl"><input type="checkbox" id="cfg-trend" onchange="applySettings()"><span class="tgl-slider"></span></label>
    </div>
    <div class="sp-row">

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby8loHM_Th6iMYyERRPy_O1KQrWD21ZshQiMATU7C9gZSa1621Q2w-S38N4NIFjGVrs/exec';
/* 專案管理表 GAS（每日追蹤/募資期追蹤/廣告受眾等，v1.2）：LINE 好友數即時比對用 */
const MGMT_GAS_URL = 'https://script.google.com/macros/s/AKfycbw1rRTFPKW_DDF44vyKakXjrkTc6PTxAhhn14TuygSZ8ZxXrBQ5nQjVKKnzpp69-W6q/exec';

/* ═══ 設定（localStorage 持久化，失敗時退回記憶體） ═══ */
const DEFAULTS = { theme:'dark', trend:true, q1:true, q3:true, q4:true, q5:true, q2:'pie', q6:'pie', comments:true };
let CFG = { ...DEFAULTS };
try {
  const saved = localStorage.getItem('huroyama_dash_cfg');
  if (saved) {
    const parsed = JSON.parse(saved);
    /* 只合併已知欄位，避免舊版資料結構污染新欄位 */
    Object.keys(DEFAULTS).forEach(k => { if (parsed[k] !== undefined) CFG[k] = parsed[k]; });
  }
} catch(e) {}

function saveCfg() {
  try { localStorage.setItem('huroyama_dash_cfg', JSON.stringify(CFG)); } catch(e) {}
}

function setTheme(t) {
  CFG.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  saveCfg(); syncSettingsUI();
  if (lastData) drawLineChart(lastData.daily); /* 重繪以套用主題色 */
  if (lastData) redrawPies();
}

function setChartType(q, v) {
  CFG[q] = v;
  saveCfg(); syncSettingsUI();
  if (lastData) render(lastData);
}

function applySettings() {
  if (!initDone) return;
  CFG.trend = document.getElementById('cfg-trend').checked;
  CFG.q1 = document.getElementById('cfg-q1').checked;
  CFG.q3 = document.getElementById('cfg-q3').checked;
  CFG.q4 = document.getElementById('cfg-q4').checked;
  CFG.q5 = document.getElementById('cfg-q5').checked;
  CFG.comments = document.getElementById('cfg-comments').checked;
  saveCfg();
  if (lastData) render(lastData);
}

function syncSettingsUI() {
  document.getElementById('cfg-trend').checked = CFG.trend;
  document.getElementById('cfg-q1').checked = CFG.q1;
  document.getElementById('cfg-q3').checked = CFG.q3;
  document.getElementById('cfg-q4').checked = CFG.q4;
  document.getElementById('cfg-q5').checked = CFG.q5;
  document.getElementById('cfg-comments').checked = CFG.comments;
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === CFG.theme));
  document.querySelectorAll('#q2Seg button').forEach(b => b.classList.toggle('on', b.dataset.v === CFG.q2));
  document.querySelectorAll('#q6Seg button').forEach(b => b.classList.toggle('on', b.dataset.v === CFG.q6));
}

function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
  document.getElementById('settingsPanel').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
  document.getElementById('settingsPanel').classList.remove('open');
}
function resetSettings() {
  CFG = { ...DEFAULTS };
  saveCfg();
  document.documentElement.setAttribute('data-theme', CFG.theme);
  syncSettingsUI();
  if (lastData) render(lastData);
}

/* ═══ 資料載入 ═══ */
let lastData = null;
let mgmtData = null;   /* 專案管理表資料（可能為 null：未部署/權限不足時不影響其他功能） */
let activeTab = 'overview';

/* 日期正規化：管理表日期可能是 "07/10" 文字或 "2026-07-10"，統一成 yyyy-mm-dd */
function normDate(s) {
  s = String(s || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (m) {
    const yr = new Date().getFullYear();
    return `${yr}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  }
  return s;
}

function switchTab(t) {
  activeTab = t;
  ['overview','cross','line'].forEach(id => {
    const el = document.getElementById('tab-' + id);
    if (el) el.style.display = (t === id) ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === t);
  });
  /* 切分頁時觸發該分頁的入場與條形動畫 */
  if (t !== 'overview') {
    requestAnimationFrame(() => {
      document.querySelectorAll('#tab-' + t + ' .reveal').forEach(el => el.classList.add('in'));
      setTimeout(triggerBars, 150);
    });
  }
}

async function loadData() {
  const app = document.getElementById('app');
  document.getElementById('lastUpdated').textContent = '更新中…';
  try {
    const [statsR, mgmtR] = await Promise.allSettled([
      fetch(GAS_URL + '?action=stats').then(r => r.json()),
      fetch(MGMT_GAS_URL + '?action=list').then(r => r.json())
    ]);
    if (statsR.status === 'rejected') throw new Error('問卷 GAS 連線失敗');
    const data = statsR.value;
    if (data.error) throw new Error(data.error);
    lastData = data;
    mgmtData = (mgmtR.status === 'fulfilled' && mgmtR.value && mgmtR.value.ok) ? mgmtR.value : null;
    render(data);
    document.getElementById('lastUpdated').textContent =
      new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'}) + ' 已更新';
  } catch (e) {
    app.innerHTML = `<div class="error-msg">讀取資料失敗：${e.message}<br>請確認 GAS 已部署 v8 並啟用 action=stats 端點。</div>`;
    document.getElementById('lastUpdated').textContent = '';
  }
}

const pct = (n,t) => t ? (n/t*100).toFixed(0)+'%' : '0%';

/* ═══ 比例色階：0%=螢光綠 → 50%=藍 → 100%=Apple粉紅（連續插值）═══ */
const RATIO_STOPS = [
  { p:0,   c:[80, 255, 160] },   /* 螢光綠 */
  { p:50,  c:[80, 168, 204] },   /* 品牌藍 */
  { p:100, c:[255, 90, 170] }    /* Apple 亮粉 */
];
function ratioColor(p) {
  p = Math.max(0, Math.min(100, p));
  let a = RATIO_STOPS[0], b = RATIO_STOPS[RATIO_STOPS.length-1];
  for (let i=0;i<RATIO_STOPS.length-1;i++) {
    if (p >= RATIO_STOPS[i].p && p <= RATIO_STOPS[i+1].p) { a = RATIO_STOPS[i]; b = RATIO_STOPS[i+1]; break; }
  }
  const t = (b.p===a.p) ? 0 : (p-a.p)/(b.p-a.p);
  const rgb = a.c.map((v,i) => Math.round(v + (b.c[i]-v)*t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

/* ═══ 主渲染 ═══ */
function render(d) {
  const app = document.getElementById('app');
  const s = d.summary;
  const n = +s.totalResponses;
  /* v4：不重複訪客 / 每人轉換率（舊版 GAS 未回傳時退回原欄位） */
  const uVis  = (s.uniqueVisitors     != null) ? +s.uniqueVisitors     : +s.totalVisits;
  const uRate = (s.uniqueResponseRate != null) ?  s.uniqueResponseRate :  s.responseRate;

  const gMap = {female:'女性', male:'男性', other:'其他/不透露'};
  const gender = {};
  Object.entries(d.q6_gender).forEach(([k,v]) => { gender[gMap[k]||k] = v; });

  let html = `
    <div class="hero reveal">
      <div class="hero-eyebrow">HUROYAMA Survey Analytics</div>
      <div class="hero-number" id="heroNum">0</div>
      <div class="hero-label">份問卷回覆，持續累積中</div>
      <div class="kpi-row">
        <div class="kpi reveal">
          <div class="kpi-v">${uVis.toLocaleString()}<span class="u">人</span></div>
          <div class="kpi-l">不重複訪客</div>
          <div style="font-size:11px;color:var(--txt3);margin-top:6px;font-family:var(--f-en)">總瀏覽 ${(+s.totalVisits).toLocaleString()} 次</div>
        </div>
        <div class="kpi reveal">
          <div class="kpi-v">${uRate}<span class="u">%</span></div>
          <div class="kpi-l">每人轉換率</div>
          <div style="font-size:11px;color:var(--txt3);margin-top:6px;font-family:var(--f-en)">次數轉換率 ${s.responseRate}%</div>
        </div>
        <div class="kpi reveal">
          <div class="kpi-v" style="font-size:17px;padding-top:8px">${s.latestTime || '—'}</div>
          <div class="kpi-l">最新回覆</div>
        </div>
      </div>
    </div>`;

  if (CFG.trend) {
    html += `
    <div class="pearl-divider"></div>
    <div class="section reveal">
      <div class="sec-head">
        <div class="sec-kicker">Trend</div>
        <div class="sec-title">回覆趨勢</div>
      </div>
      <div class="card">
        <div class="card-title">每日回覆人數</div>
        <div class="card-sub">依台北時區統計，滑鼠移入資料點可查看明細</div>
        <canvas id="lineChart" height="220"></canvas>
      </div>
    </div>`;
  }

  const anyResults = CFG.q1 || CFG.q3 || CFG.q4 || CFG.q5 || CFG.q2!=='off' || CFG.q6!=='off';
  if (anyResults) {
    html += `<div class="pearl-divider"></div>
    <div class="section">
      <div class="sec-head reveal">
        <div class="sec-kicker">Results</div>
        <div class="sec-title">問卷結果分析</div>
      </div>`;

    if (CFG.q1) html += `
      <div class="card reveal">
        <div class="card-title">Q1 — 你家水槽是否有這些困擾？</div>
        <div class="card-sub">可複選・百分比為勾選人數佔總回覆比例</div>
        <div class="bars" id="q1bars"></div>
      </div>`;

    if (CFG.q3) html += `
      <div class="card reveal">
        <div class="card-title">Q3 — 哪個特色最打動你？</div>
        <div class="card-sub">可複選</div>
        <div class="bars" id="q3bars"></div>
      </div>`;

    /* Q4 + Q6 一組 */
    if (CFG.q4 || CFG.q6 !== 'off') {
      html += `<div class="two-col" style="margin-top:16px">`;
      if (CFG.q4) html += `
        <div class="card reveal">
          <div class="card-title">Q4 — 購買意願分數</div>
          <div class="card-sub">1–7 分，分數越高代表越心動</div>
          <div class="intent-wrap" id="intentGrid"></div>
          <div class="intent-summary">
            <div class="intent-avg" id="intentAvg">—</div>
            <div class="intent-avg-l">平均分數（滿分 7）</div>
          </div>
        </div>`;
      if (CFG.q6 !== 'off') html += `
        <div class="card reveal">
          <div class="card-title">Q6 — 性別分布</div>
          <div class="card-sub">${CFG.q6==='pie'?'圓餅圖':'長條圖'}</div>
          ${CFG.q6==='pie'
            ? `<div class="pie-flex">
                 <div class="pie-canvas-wrap"><canvas id="pie-q6" width="190" height="190"></canvas>
                   <div class="pie-center"><div class="pie-center-n" id="pie-q6-n"></div><div class="pie-center-l">總數</div></div>
                 </div>
                 <div class="pie-legend" id="pie-q6-legend"></div>
               </div>`
            : `<div class="dists" id="genderDist"></div>`}
        </div>`;
      html += `</div>`;
    }

    /* Q2 + Q5 一組 */
    if (CFG.q2 !== 'off' || CFG.q5) {
      html += `<div class="two-col" style="margin-top:16px">`;
      if (CFG.q2 !== 'off') html += `
        <div class="card reveal">
          <div class="card-title">Q2 — 水槽尺寸</div>
          <div class="card-sub">${CFG.q2==='pie'?'圓餅圖':'長條圖'}・單選</div>
          ${CFG.q2==='pie'
            ? `<div class="pie-flex">
                 <div class="pie-canvas-wrap"><canvas id="pie-q2" width="190" height="190"></canvas>
                   <div class="pie-center"><div class="pie-center-n" id="pie-q2-n"></div><div class="pie-center-l">總數</div></div>
                 </div>
                 <div class="pie-legend" id="pie-q2-legend"></div>
               </div>`
            : `<div class="dists" id="sinkDist"></div>`}
        </div>`;
      if (CFG.q5) html += `
        <div class="card reveal">
          <div class="card-title">Q5 — 有興趣的加購品</div>
          <div class="card-sub">可複選</div>
          <div class="bars" id="q5bars"></div>
        </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (CFG.comments && d.comments && d.comments.length > 0) {
    html += `<div class="pearl-divider"></div>
    <div class="section reveal">
      <div class="sec-head">
        <div class="sec-kicker">Feedback</div>
        <div class="sec-title">留言精選</div>
      </div>
      <div class="card">
        <div class="cmt-toolbar">
          <div class="cmt-count" id="cmtCount"></div>
          <div class="cmt-show-hidden" onclick="toggleShowHidden()" id="cmtShowHiddenToggle">👁 顯示已隱藏</div>
        </div>
        <div class="cmt-list" id="cmtList"></div>
      </div>
    </div>`;
  }

  /* ── 交叉分析分頁內容（需 GAS v7 的 cross 欄位）── */
  let crossHtml = '';
  if (d.cross) {
    const X = d.cross;
    const overallAvg = X.q4_overall_avg ? (+X.q4_overall_avg).toFixed(2) : '—';

    /* Q4 × Q2 */
    const q4q2rows = Object.entries(X.q4_by_q2)
      .sort((a,b) => b[1].avg - a[1].avg)
      .map(([k,v]) => {
        const pctW = (v.avg/7*100).toFixed(0);
        const color = ratioColor(v.avg/7*100);
        return `
        <div class="x-row">
          <div class="x-name">${k}</div>
          <div class="x-track"><div class="x-fill" data-w="${pctW}" data-color="${color}"></div></div>
          <div class="x-meta">${v.avg.toFixed(2)}<span class="xn">n=${v.count}</span></div>
        </div>`;
      }).join('');

    /* Q4 × Q1 */
    const q4q1rows = [...X.q4_by_q1]
      .sort((a,b) => (b.avg||0) - (a.avg||0))
      .map(item => {
        if (item.avg === null) return '';
        const pctW = (item.avg/7*100).toFixed(0);
        const color = ratioColor(item.avg/7*100);
        return `
        <div class="x-row">
          <div class="x-name">${item.label}</div>
          <div class="x-track"><div class="x-fill" data-w="${pctW}" data-color="${color}"></div></div>
          <div class="x-meta">${item.avg.toFixed(2)}<span class="xn">n=${item.count}</span></div>
        </div>`;
      }).join('');

    /* Q1 × Q3 熱力圖 */
    const M = X.q1_x_q3;
    let heatCells = `<div class="heat-cell heat-head"></div>` +
      M.featLabels.map(f => `<div class="heat-cell heat-head">${f}</div>`).join('');
    M.matrix.forEach(row => {
      heatCells += `<div class="heat-cell heat-head heat-rowlabel">${row.pain}<span class="heat-sub">n=${row.total}</span></div>`;
      row.feats.forEach(cnt => {
        const p = row.total > 0 ? (cnt/row.total*100) : 0;
        const color = ratioColor(p);
        heatCells += `<div class="heat-cell" style="background:${color}">${p.toFixed(0)}%<span class="heat-sub">${cnt}人</span></div>`;
      });
    });

    crossHtml = `
    <div class="section reveal" style="margin-top:48px">
      <div class="sec-head">
        <div class="sec-kicker">Cross Analysis</div>
        <div class="sec-title">交叉分析</div>
      </div>

      <div class="card reveal">
        <div class="card-title">購買意願 × 水槽尺寸</div>
        <div class="card-sub">各尺寸受訪者的平均心動分數（滿分 7）・依分數高至低排列</div>
        <div class="x-bars">${q4q2rows}</div>
        <div class="x-ref">全體平均：${overallAvg}</div>
      </div>

      <div class="card reveal">
        <div class="card-title">購買意願 × 痛點</div>
        <div class="card-sub">勾選各痛點的受訪者，平均心動分數是多少・同一人可能勾選多個痛點</div>
        <div class="x-bars">${q4q1rows}</div>
        <div class="x-ref">全體平均：${overallAvg}</div>
      </div>

      <div class="card reveal">
        <div class="card-title">痛點 × 功能偏好 熱力圖</div>
        <div class="card-sub">有某痛點的人當中，被各功能打動的比例（顏色越粉紅 = 比例越高）</div>
        <div class="heat-wrap">
          <div class="heat-grid" style="grid-template-columns:130px repeat(4,1fr)">${heatCells}</div>
        </div>
        <div class="heat-note">讀法範例：左上第一格 = 勾選「${M.painLabels[0]}」的人裡，有多少比例同時被「${M.featLabels[0]}」打動。<br>此為複選交叉，橫列比例加總可能超過 100%。</div>
      </div>
    </div>`;
  } else {
    crossHtml = `<div class="error-msg" style="margin-top:60px">交叉分析需要 GAS v7 以上版本。請將 huroyama_GAS_v7.js 貼入 Apps Script 並重新部署。</div>`;
  }

  /* ── LINE 成效分頁（問卷點擊 × 管理表好友數即時比對）── */
  let lineHtml = '';
  {
    const clkTotal  = (s.lineClickTotal  != null) ? +s.lineClickTotal  : null;
    const clkUnique = (s.lineClickUnique != null) ? +s.lineClickUnique : null;

    /* 管理表每日追蹤：date/budget/spend/land/comp/cpl/ctr/line/note */
    const mgmtRows = (mgmtData && Array.isArray(mgmtData.survey)) ? mgmtData.survey : null;
    let friendSum = null;
    const mgmtByDate = {};
    if (mgmtRows) {
      friendSum = 0;
      mgmtRows.forEach(r => {
        const key = normDate(r.date);
        mgmtByDate[key] = r;
        const lv = parseFloat(r.line);
        if (!isNaN(lv)) friendSum += lv;
      });
    }

    const conv = (friendSum != null && clkUnique > 0)
      ? (friendSum / clkUnique * 100).toFixed(0) + '%'
      : '—';

    /* 每日對照表：問卷回覆(stats.daily) × 管理表(line/spend) 依日期合併 */
    const respByDate = {};
    (d.daily || []).forEach(x => { respByDate[x.date] = x.count; });
    const allDates = [...new Set([...Object.keys(respByDate), ...Object.keys(mgmtByDate)])].sort().reverse();

    const tableRows = allDates.map(dt => {
      const m = mgmtByDate[dt] || {};
      const lineV  = (m.line  !== undefined && m.line  !== '') ? m.line  : '—';
      const spendV = (m.spend !== undefined && m.spend !== '') ? m.spend : '—';
      const noteV  = m.note || '';
      return `<tr>
        <td>${dt.slice(5)}</td>
        <td>${respByDate[dt] ?? '—'}</td>
        <td>${spendV}</td>
        <td>${lineV}</td>
        <td class="zh">${escapeHtml(String(noteV)).slice(0,30)}</td>
      </tr>`;
    }).join('');

    /* 點過 LINE 按鈕的填答者名單（GAS v8）*/
    let clickersHtml = '';

        <div class="ltable-wrap">
          <table class="ltable">
            <thead><tr><th style="text-align:left">姓名</th><th style="text-align:left">Email</th></tr></thead>
            <tbody>${d.lineClickers.map(p => `<tr><td class="zh">${escapeHtml(p.name)}</td><td style="text-align:left">${escapeHtml(p.email)}</td></tr>`).join('')}</tbody>

    lineHtml = `
    <div class="section reveal" style="margin-top:48px">

        <div class="sec-title">LINE 成效</div>

        <div class="kpi reveal">

          <div class="kpi-l">LINE 按鈕點擊</div>
          <div style="font-size:11px;color:var(--txt3);margin-top:6px">${clkUnique != null ? '不重複 ' + clkUnique + ' 人' : '需 GAS v8'}</div>
        </div>
        <div class="kpi reveal">
          <div class="kpi-v">${friendSum != null ? friendSum.toLocaleString() : '—'}<span class="u">人</span></div>
          <div class="kpi-l">LINE 好友累計（管理表）</div>
          <div style="font-size:11px;color:var(--txt3);margin-top:6px">${mgmtRows ? '每日追蹤 line 欄加總' : '管理表連線失敗'}</div>
        </div>
        <div class="kpi reveal">
          <div class="kpi-v">${conv}</div>
          <div class="kpi-l">點擊 → 加好友 估計轉換</div>

      </div>

      ${!mgmtRows ? `<div class="error-msg">無法讀取專案管理表 GAS。請確認該部署「誰可以存取」設為「所有人」，並已用新版本重新部署。</div>` : ''}

      <div class="card reveal">
        <div class="card-title">每日對照</div>
        <div class="card-sub">問卷回覆（自動統計）× 廣告花費 / LINE 好友（管理表「每日追蹤」手動記錄）</div>
        <div class="ltable-wrap">

            <tbody>${tableRows || '<tr><td colspan="5" class="zh">尚無資料</td></tr>'}</tbody>

  html = `

      <button class="tab-btn ${activeTab==='overview'?'on':''}" data-tab="overview" onclick="switchTab('overview')">總覽</button>

  app.innerHTML = html;

  animateNumber(document.getElementById('heroNum'), n, 1200);

  if (CFG.trend) drawLineChart(d.daily);
  if (CFG.q1) renderBars('q1bars', d.q1_pains.labels, d.q1_pains.counts, n);

      <div class="ic">
        <div class="ic-bar-zone"><div class="ic-bar" data-h="${Math.round((b[k]||0)/maxB*86)}"></div></div>
        <div class="ic-n">${b[k]||0}</div>
        <div class="ic-s">${k}</div>

    document.getElementById('intentAvg').textContent = d.q4_intent.avg || '—';
  }

  if (CFG.q2 === 'pie') drawPie('q2', d.q2_sink);
  else if (CFG.q2 === 'bars') renderDist('sinkDist', d.q2_sink);

  if (CFG.q6 === 'pie') drawPie('q6', gender);
  else if (CFG.q6 === 'bars') renderDist('genderDist', gender);

  if (CFG.comments && d.comments) renderComments(d.comments);

  requestAnimationFrame(() => {
    setupReveal();
    setTimeout(triggerBars, 300);

}

/* ═══ 元件渲染 ═══ */
function renderBars(elId, labels, counts, total) {
  const max = Math.max(...counts, 1);
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = labels.map((lbl,i) => {
    const ratioPct = total ? (counts[i]/total*100) : 0;
    const color = ratioColor(ratioPct);
    const widthPct = (counts[i]/max*100).toFixed(0);
    return `
    <div class="bar-row">
      <div class="bar-name">${lbl}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${widthPct}" data-color="${color}"></div></div>
      <div class="bar-meta">${counts[i]}<span class="pc">${pct(counts[i], total)}</span></div>
    </div>`;
  }).join('');
}

function renderDist(elId, map) {
  const el = document.getElementById(elId);
  if (!el) return;
  const total = Object.values(map).reduce((a,b)=>a+b,0) || 1;
  el.innerHTML =
    Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v]) => {
      const ratioPct = (v/total*100);
      const color = ratioColor(ratioPct);
      return `
      <div class="dist-row">
        <div class="dist-name">${k}</div>
        <div class="dist-track"><div class="dist-fill" data-w="${ratioPct.toFixed(0)}" data-color="${color}"></div></div>
        <div class="dist-n">${v}</div>
      </div>`;
    }).join('');
}

/* ═══ 留言標記（好/壞/隱藏）— v6：共用狀態，存在 GAS 後端「留言標記」工作表
   每則留言的 mark 直接來自 stats API 回傳的 c.mark 欄位，所有人看到同一套 ═══ */
let cmtShowHidden = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 過濾「廢話留言」：整則留言拿掉標點/空白後，本質上只是「貴」「便宜」
   （可加「太/好/有點/偏/再」等修飾字），沒有其他實質內容才會被濾掉。
   若留言裡還有其他文字（例如「希望便宜一點，但設計真的不錯」），不會被誤殺。 */
const THROWAWAY_RE = /^(有點|有点|太|好|偏|更|再)?(貴|贵|便宜)(一點|一点|一些|些|點|点)?(了|喔|哦|啊|呀|呢)*[!！。.]*$/;
function isThrowawayComment(text) {
  const stripped = String(text).replace(/[\s，,、。.!！?？~～]/g, '');
  return THROWAWAY_RE.test(stripped);
}

const CMT_PAGE_SIZE = 20;
let cmtVisibleCount = CMT_PAGE_SIZE;

function renderComments(comments) {
  comments = comments.filter(c => !isThrowawayComment(c.text));
  const list = document.getElementById('cmtList');
  const countEl = document.getElementById('cmtCount');
  if (!list) return;

  const hiddenCount = comments.filter(c => c.mark === 'hidden').length;
  countEl.textContent = `共 ${comments.length} 則留言` + (hiddenCount ? `（${hiddenCount} 則已隱藏）` : '');

  if (comments.length === 0) {
    list.innerHTML = `<div class="cmt-empty">目前還沒有留言</div>`;
    return;
  }

  /* 分頁：一次只渲染 cmtVisibleCount 則，避免幾百則留言一次塞爆頁面 */
  const visible = comments.slice(0, cmtVisibleCount);
  const remaining = comments.length - visible.length;

  list.innerHTML = visible.map(c => {
    const mark = c.mark || '';
    const classes = ['cmt-item'];
    if (mark === 'good') classes.push('mark-good');
    if (mark === 'bad') classes.push('mark-bad');
    if (mark === 'hidden') classes.push('mark-hidden', cmtShowHidden ? 'force-show' : '');
    return `
    <div class="${classes.join(' ')}" id="cmt-${c.id}">
      <div class="cmt-meta">
        <span class="cmt-who">${escapeHtml(c.name)}</span>
        <span class="cmt-time">${c.time}</span>
      </div>
      <div class="cmt-text">${escapeHtml(c.text)}</div>
      <div class="cmt-actions">
        <button class="cmt-btn ${mark==='good'?'active-good':''}" onclick="markComment(${c.id},'good')">👍 有幫助</button>
        <button class="cmt-btn ${mark==='bad'?'active-bad':''}" onclick="markComment(${c.id},'bad')">👎 普通</button>
        <button class="cmt-btn ${mark==='hidden'?'active-hide':''}" onclick="markComment(${c.id},'hidden')">🙈 隱藏</button>
      </div>
    </div>`;
  }).join('')
  + (remaining > 0
      ? `<button class="cmt-btn" style="align-self:center; padding:9px 26px; font-size:12px" onclick="showMoreComments()">顯示更多（還有 ${remaining} 則）</button>`
      : '');
}

function showMoreComments() {
  cmtVisibleCount += CMT_PAGE_SIZE;
  if (lastData && lastData.comments) renderComments(lastData.comments);
}

/* 標記留言：先在本地畫面立即更新（樂觀更新，手感即時），
   同時把標記送到 GAS 共用工作表，失敗則還原並提示 */
function markComment(id, type) {
  if (!lastData || !lastData.comments) return;
  const c = lastData.comments.find(x => x.id === id);
  if (!c) return;
  const prevMark = c.mark || '';
  const newMark = (prevMark === type) ? '' : type; // 再點一次同個按鈕 = 取消標記

  c.mark = newMark; // 樂觀更新
  renderComments(lastData.comments);

  fetch(GAS_URL, {
    method: 'POST', mode: 'no-cors',
    body: JSON.stringify({ action: 'mark_comment', id, mark: newMark })
  }).catch(err => {
    console.error('留言標記同步失敗:', err);
    c.mark = prevMark; // 送出失敗，還原畫面
    renderComments(lastData.comments);
    alert('標記可能未成功同步，請檢查網路後再試一次');
  });
}

function toggleShowHidden() {
  cmtShowHidden = !cmtShowHidden;
  document.getElementById('cmtShowHiddenToggle').style.color = cmtShowHidden ? 'var(--gold)' : '';
  if (lastData && lastData.comments) renderComments(lastData.comments);
}

/* ═══ 圓餅圖（donut）═══ */
const PIE_COLORS = ['#50A8CC', '#1E5BAE', '#7ec8ff', '#a8d4ff', '#0d3a6b', '#6ba3e0'];
const pieStore = {};

function drawPie(qid, map) {
  const canvas = document.getElementById('pie-'+qid);
  if (!canvas) return;
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((a,[,v])=>a+v,0) || 1;
  pieStore[qid] = { entries, total };

  paintPie(canvas, entries, total);

  document.getElementById('pie-'+qid+'-n').textContent = total;
  document.getElementById('pie-'+qid+'-legend').innerHTML = entries.map(([k,v],i) => `
    <div class="pl-row">
      <div class="pl-chip" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></div>
      <div class="pl-name">${k}</div>
      <div class="pl-val">${v}</div>
      <div class="pl-pct">${(v/total*100).toFixed(0)}%</div>
    </div>`).join('');
}

function paintPie(canvas, entries, total) {
  const dpr = window.devicePixelRatio || 1;
  const SIZE = 190;
  canvas.width = SIZE*dpr; canvas.height = SIZE*dpr;
  canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const cx = SIZE/2, cy = SIZE/2, R = SIZE/2-6, r = R*0.62;

  let a0 = -Math.PI/2;
  entries.forEach(([k,v],i) => {
    const a1 = a0 + (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,R,a0,a1);
    ctx.arc(cx,cy,r,a1,a0,true);
    ctx.closePath();
    ctx.fillStyle = PIE_COLORS[i%PIE_COLORS.length];
    ctx.fill();
    /* 分隔細縫 */
    ctx.strokeStyle = getComputedStyle(document.body).backgroundColor || '#0a2540';
    ctx.lineWidth = 2;
    ctx.stroke();
    a0 = a1;
  });
}

function redrawPies() {
  Object.entries(pieStore).forEach(([qid, s]) => {
    const canvas = document.getElementById('pie-'+qid);
    if (canvas) paintPie(canvas, s.entries, s.total);
  });
}

function triggerBars() {
  document.querySelectorAll('.bar-fill[data-w], .x-fill[data-w]').forEach(el => {
    el.style.width = el.dataset.w + '%';
    if (el.dataset.color) {
      el.style.background = el.dataset.color;
      el.style.boxShadow = `0 0 14px ${el.dataset.color.replace('rgb','rgba').replace(')', ',.4)')}`;
    }
  });
  document.querySelectorAll('.dist-fill[data-w]').forEach(el => {
    el.style.width = el.dataset.w + '%';
    if (el.dataset.color) el.style.background = el.dataset.color;
  });
  document.querySelectorAll('.ic-bar[data-h]').forEach(el => el.style.height = el.dataset.h + 'px');
}

function setupReveal() {
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(entries => {
    entries.forEach((e,i) => {
      if (e.isIntersecting) {
        setTimeout(() => e.target.classList.add('in'), (i%4)*90);
        io.unobserve(e.target);
      }
    });
  }, { threshold:.01 });
  els.forEach(el => io.observe(el));
}

function animateNumber(el, target, dur) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min((now-t0)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target*eased).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ═══ 折線圖 ═══ */
function chartColors() {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  return {
    grid: light ? 'rgba(30,91,174,.08)' : 'rgba(168,212,255,.06)',
    axis: light ? 'rgba(30,91,174,.4)'  : 'rgba(168,212,255,.3)',
    line: light ? '#1E5BAE' : '#7ec8ff',
    dot:  '#50A8CC',
    dotHover: light ? '#1E5BAE' : '#c8e8ff',
    fillTop: light ? 'rgba(30,91,174,.18)' : 'rgba(126,200,255,.28)',
    tooltipBg: light ? 'rgba(240,247,255,.95)' : 'rgba(10,25,45,.92)',
    tooltipBorder: light ? 'rgba(30,91,174,.3)' : 'rgba(126,200,255,.35)',
    tooltipTxt: light ? '#0A2540' : '#c8e8ff',
  };
}

function drawLineChart(daily) {
  const canvas = document.getElementById('lineChart');
  if (!canvas || !daily || daily.length === 0) return;
  paintChart(canvas, daily);
  canvas.onmousemove = e => hoverChart(canvas, daily, e);
  canvas.onmouseleave = () => paintChart(canvas, daily);
}

function chartGeom(canvas, daily) {
  const W = canvas.parentElement.offsetWidth;
  const H = 220;
  const PAD = { top:24, right:24, bottom:36, left:40 };
  return { W, H, PAD, w:W-PAD.left-PAD.right, h:H-PAD.top-PAD.bottom,
           maxV: Math.max(...daily.map(d=>d.count), 1) };
}

function paintChart(canvas, daily, hoverIdx=-1) {
  const g = chartGeom(canvas, daily);
  const C = chartColors();
  canvas.width = g.W; canvas.height = g.H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,g.W,g.H);

  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 1;
  for (let i=0;i<=4;i++) {
    const y = g.PAD.top + g.h - (i/4)*g.h;
    ctx.beginPath(); ctx.moveTo(g.PAD.left,y); ctx.lineTo(g.PAD.left+g.w,y); ctx.stroke();
    ctx.fillStyle = C.axis;
    ctx.font = '10px DM Sans';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(g.maxV*i/4), g.PAD.left-8, y+3);
  }

  const pts = daily.map((d,i) => ({
    x: g.PAD.left + (i/(daily.length-1||1))*g.w,
    y: g.PAD.top + g.h - (d.count/g.maxV)*g.h
  }));

  const grad = ctx.createLinearGradient(0,g.PAD.top,0,g.PAD.top+g.h);
  grad.addColorStop(0,C.fillTop);
  grad.addColorStop(1,'rgba(126,200,255,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, g.PAD.top+g.h);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x, g.PAD.top+g.h);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  pts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();

  pts.forEach((p,i) => {
    ctx.beginPath();
    ctx.arc(p.x,p.y, i===hoverIdx?5.5:3, 0, Math.PI*2);
    ctx.fillStyle = i===hoverIdx ? C.dotHover : C.dot;
    ctx.fill();
  });

  ctx.fillStyle = C.axis;
  ctx.font = '10px DM Sans';
  ctx.textAlign = 'center';
  const step = Math.ceil(daily.length/9);
  daily.forEach((d,i) => {
    if (i%step!==0 && i!==daily.length-1) return;
    ctx.fillText(d.date.slice(5), g.PAD.left+(i/(daily.length-1||1))*g.w, g.PAD.top+g.h+22);
  });

  if (hoverIdx >= 0) {
    const p = pts[hoverIdx], d = daily[hoverIdx];
    const label = `${d.date}  ${d.count} 份`;
    ctx.font = '12px DM Sans';
    const tw = ctx.measureText(label).width + 20;
    let tx = p.x - tw/2;
    tx = Math.max(g.PAD.left, Math.min(tx, g.W-g.PAD.right-tw));
    const ty = Math.max(6, p.y - 40);
    ctx.fillStyle = C.tooltipBg;
    ctx.strokeStyle = C.tooltipBorder;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tx, ty, tw, 26, 8);
    else ctx.rect(tx, ty, tw, 26);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.tooltipTxt;
    ctx.textAlign = 'center';
    ctx.fillText(label, tx+tw/2, ty+17);
  }
}

function hoverChart(canvas, daily, e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const g = chartGeom(canvas, daily);
  let best = -1, bd = 1e9;
  daily.forEach((d,i) => {
    const px = g.PAD.left + (i/(daily.length-1||1))*g.w;
    const dist = Math.abs(px-x);
    if (dist < bd) { bd = dist; best = i; }
  });
  if (bd < 30) paintChart(canvas, daily, best);
  else paintChart(canvas, daily);
}

window.addEventListener('resize', () => { if (lastData && CFG.trend) drawLineChart(lastData.daily); });

document.documentElement.setAttribute('data-theme', CFG.theme);
syncSettingsUI();
initDone = true;
